<!-- Rhythm Pulse (for tense feelings)
     Tap along to a soft beat that slowly gets slower (from about 100 to 60
     beats a minute). Matching a slowing rhythm helps the body slow down too.
     There's no score: the ripple just shows your tap. -->
<h1>Rhythm Pulse</h1>
<p class="hint">Tap the circle (or press the space bar) along with the pulse. The beat slows down over two minutes. Let your taps slow with it.</p>
<canvas id="pulse" width="640" height="340" aria-label="A pulsing circle. Tap along with the beat."></canvas>
<div class="row">
  <button class="primary" id="go">Start the beat</button>
  <label class="soft"><input type="checkbox" id="sound"> Soft tick sound</label>
</div>
<p class="soft" id="msg">Press start when you're ready.</p>
<script>
const cv = document.getElementById("pulse"), ctx = cv.getContext("2d");
const FROM = 100, TO = 60, MINUTES = 2;
let start = null, lastBeat = -1, flash = 0, ripples = [], audio = null;

function bpm(now) {
  const k = Math.min(1, (now - start) / (MINUTES * 60000));
  return FROM + (TO - FROM) * k;
}
function tick() {
  if (!document.getElementById("sound").checked) return;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 520; g.gain.setValueAtTime(0.08, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.25);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.26);
}
function tap() { if (start) ripples.push({r: 70, a: 1}); }
document.getElementById("go").onclick = e => { start = performance.now(); e.target.textContent = "Restart"; lastBeat = -1; phaseTime = 0; prev = null;
  document.getElementById("msg").textContent = "Tap along. No need to be perfect."; };
cv.addEventListener("pointerdown", tap);
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); tap(); } });

let beats = 0, phaseTime = 0, prev = null;
function draw(now) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const cx = cv.width / 2, cy = cv.height / 2;
  let pulse = 0;
  if (start) {
    if (prev !== null) phaseTime += (now - prev) * bpm(now) / 60000;   // counts beats, even while the tempo changes
    prev = now;
    if (Math.floor(phaseTime) !== lastBeat) { lastBeat = Math.floor(phaseTime); flash = 1; tick(); }
    pulse = Math.max(0, 1 - (phaseTime % 1) * 3);
    if ((now - start) / 60000 >= MINUTES) document.getElementById("msg").textContent =
      "You've slowed right down. Stay here as long as you like.";
  }
  const r = 70 + (REDUCED ? 0 : pulse * 22);
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, PALETTE[0]); g.addColorStop(1, INK);
  ctx.globalAlpha = REDUCED ? 0.7 + pulse * 0.3 : 1;
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  for (let i = ripples.length - 1; i >= 0; i--) {
    const p = ripples[i]; p.r += 2.2; p.a -= 0.025;
    if (p.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(255,255,255,${p.a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, p.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = "rgba(52,49,59,0.6)"; ctx.font = "13px Manrope, system-ui, sans-serif"; ctx.textAlign = "center";
  if (start) ctx.fillText(Math.round(bpm(now)) + " beats a minute", cx, cv.height - 16);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
